<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mehmet Emin Polat iletişim sayfası.">
    <title>İletişim | Mehmet Emin Polat</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">MEP<span>.</span></a>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <nav class="nav" id="navigation">
        <a href="index.html">Ana Sayfa</a>
        <a href="hakkimda.html">Hakkımda</a>
        <a href="youtube.html">YouTube</a>
        <a href="iletisim.html" class="active">İletişim</a>
    </nav>
</header>

<main class="page">
    <span class="welcome">BANA ULAŞ</span>
    <h1>İletişim</h1>

    <div class="contact-layout">
        <div class="content-card">
            <h2>Mesaj Gönder</h2>

            <form id="contactForm">
                <label for="name">Ad Soyad</label>
                <input type="text" id="name" name="name"
                       placeholder="Adınız ve soyadınız" maxlength="80" required>

                <label for="email">E-posta</label>
                <input type="email" id="email" name="email"
                       placeholder="E-posta adresiniz" maxlength="254" required>

                <label for="phone">Telefon</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Telefon numaranız" maxlength="30">

                <label for="message">Mesajınız</label>
                <textarea id="message" name="message"
                          placeholder="Mesajınızı yazın..."
                          minlength="5" maxlength="2000" required></textarea>

                <div class="honeypot" aria-hidden="true">
                    <label for="website">Web sitesi</label>
                    <input type="text" id="website" name="website"
                           tabindex="-1" autocomplete="off">
                </div>

                <button type="submit" class="btn primary submit-btn">
                    Mesajı Gönder
                </button>

                <p id="formStatus" role="status" aria-live="polite"></p>
            </form>
        </div>

        <div class="content-card">
            <h2>İletişim</h2>
            <p>Benimle iletişime geçmek için formu kullanabilirsin.</p>
        </div>
    </div>
</main>

<footer class="footer">
    © <span id="year"></span> Mehmet Emin Polat.
</footer>

<script src="assets/js/script.js"></script>
</body>
</html>
